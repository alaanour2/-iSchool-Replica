<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loading Projects | iSchool</title>
  <link href="https://cdn.prod.website-files.com/655a78032f46f2e55da300d7/657742cf85af105651d74f51_ischool-favicon.png"
    rel="shortcut icon" type="image/x-icon" />
  <style>
    :root { --brand: #0070f3; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      padding: 24px;
      background: #f6f9ff;
      color: #123;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      text-align: center;
    }
    body img { width: clamp(110px, 28vw, 150px); height: auto; }
    .loader {
      width: 52px;
      height: 52px;
      border: 5px solid #e2ecfb;
      border-top-color: var(--brand);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    p { margin: 0; font-size: 0.95rem; color: #4b5563; }
    a { color: var(--brand); font-weight: 600; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>

<body>
  <img src="./img/logo.png" alt="iSchool logo">
  <div class="loader" role="status" aria-label="Loading"></div>
  <p>Taking you to Projects…</p>
  <noscript><p><a href="./index.html#Project">Continue to Projects</a></p></noscript>

  <script>
    setTimeout(function () {
      window.location.replace("./index.html#Project");
    }, 1200);
  </script>
</body>

</html>
